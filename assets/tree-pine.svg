<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Focus Grove original artwork: pine (flat tiered-cone style) -->
  <defs>
    <linearGradient id="pineT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f9166"/><stop offset="100%" stop-color="#2e6b4d"/>
    </linearGradient>
    <linearGradient id="pineT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4faa77"/><stop offset="100%" stop-color="#3a855c"/>
    </linearGradient>
    <linearGradient id="pineT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63bd8a"/><stop offset="100%" stop-color="#47996b"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="226" rx="50" ry="10" fill="#3c6b4e" opacity="0.18"/>
  <rect x="93" y="180" width="14" height="44" rx="6" fill="#7a5238"/>
  <rect x="96" y="180" width="5" height="44" rx="2.5" fill="#946b4a" opacity="0.85"/>
  <!-- 三层圆角锥（同色粗描边 + round join 制造圆角） -->
  <path d="M36 178 L164 178 L100 112 Z" fill="url(#pineT1)" stroke="url(#pineT1)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M50 128 L150 128 L100 72 Z" fill="url(#pineT2)" stroke="url(#pineT2)" stroke-width="20" stroke-linejoin="round"/>
  <path d="M64 84 L136 84 L100 36 Z" fill="url(#pineT3)" stroke="url(#pineT3)" stroke-width="18" stroke-linejoin="round"/>
  <!-- 顶部高光 -->
  <circle cx="92" cy="58" r="8" fill="#8fd6ac" opacity="0.8"/>
  <circle cx="104" cy="50" r="5" fill="#8fd6ac" opacity="0.55"/>
</svg>
